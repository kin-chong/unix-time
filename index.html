<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unix Time Converter</title>
<style>
  :root {
    --bg: #fafaf8;
    --text: #383632;
    --muted: #8a8780;
    --muted2: #6b6862;
    --border: #e6e4de;
    --border-strong: #d9d7d0;
    --card: #ffffff;
    --field-bg: #f7f6f3;
    --accent: #4f7cc4;
    --green: #4caf7d;
    --red: #c25a3f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: Helvetica, Arial, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 96px 24px 64px;
  }
  .wrap { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 56px; }
  .eyebrow { font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 40px; font-weight: 700; margin: 8px 0 0; letter-spacing: -0.01em; }
  .desc { font-size: 17px; line-height: 1.5; color: var(--muted2); margin: 10px 0 0; max-width: 52ch; }

  .card {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 28px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; }
  .label { font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  .tz-label { font-size: 12px; color: var(--muted2); }

  .now-row { display: flex; align-items: center; gap: 14px; }
  .now-ts { font-size: 34px; font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -0.01em; flex: 1; }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); margin-left: 12px; animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  button {
    border: 1px solid var(--border-strong);
    background: var(--field-bg);
    color: #4a4843;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #efeee9; }

  .convert-block { display: flex; flex-direction: column; gap: 16px; }
  .input-row { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1;
    font-size: 20px;
    font-family: Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    padding: 14px 16px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  .use-now-btn { font-size: 14px; padding: 0 18px; white-space: nowrap; }

  .result-card {
    display: flex; flex-direction: column; border: 1px solid var(--border);
    border-radius: 4px; overflow: hidden; background: var(--card); display: none;
  }
  .result-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 22px; border-bottom: 1px solid #edece8;
  }
  .result-row:last-child { border-bottom: none; }
  .result-col { display: flex; flex-direction: column; gap: 4px; }
  .result-main { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .result-sub { font-size: 17px; font-variant-numeric: tabular-nums; color: var(--muted2); }

  .error-msg { font-size: 14px; color: var(--red); padding: 4px 2px; display: none; }
</style>
</head>
<body>

<div class="wrap">

  <div>
    <div class="eyebrow">Time Converter</div>
    <h1>Unix time, in your timezone</h1>
    <p class="desc">Paste a Unix timestamp (in seconds) to see it converted to your local date and time, detected automatically from your browser.</p>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="label">Current Unix time</span>
      <span class="tz-label" id="tzLabel"></span>
    </div>
    <div class="now-row">
      <div class="now-ts" id="nowTs">
        <span id="nowTsVal"></span><span class="dot"></span>
      </div>
      <button id="copyNowBtn">Copy</button>
    </div>
  </div>

  <div class="convert-block">
    <label class="label" for="tsInput">Convert a timestamp</label>
    <div class="input-row">
      <input type="text" id="tsInput" placeholder="e.g. 1750000000">
      <button class="use-now-btn" id="useNowBtn">Use now</button>
    </div>

    <div class="result-card" id="resultCard">
      <div class="result-row">
        <div class="result-col">
          <span class="label">Your local time</span>
          <span class="result-main" id="localResult"></span>
        </div>
        <button id="copyLocalBtn">Copy</button>
      </div>
      <div class="result-row">
        <div class="result-col">
          <span class="label">UTC</span>
          <span class="result-sub" id="utcResult"></span>
        </div>
      </div>
      <div class="result-row">
        <div class="result-col">
          <span class="label">Relative</span>
          <span class="result-sub" id="relativeResult"></span>
        </div>
      </div>
    </div>

    <div class="error-msg" id="errorMsg">Enter a valid Unix timestamp in seconds (e.g. 10 digits for current era).</div>
  </div>

</div>

<script>
  const tzLabelEl = document.getElementById('tzLabel');
  const nowTsValEl = document.getElementById('nowTsVal');
  const copyNowBtn = document.getElementById('copyNowBtn');
  const tsInput = document.getElementById('tsInput');
  const useNowBtn = document.getElementById('useNowBtn');
  const resultCard = document.getElementById('resultCard');
  const errorMsg = document.getElementById('errorMsg');
  const localResultEl = document.getElementById('localResult');
  const utcResultEl = document.getElementById('utcResult');
  const relativeResultEl = document.getElementById('relativeResult');
  const copyLocalBtn = document.getElementById('copyLocalBtn');

  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  tzLabelEl.textContent = tz;

  let currentNow = Math.floor(Date.now() / 1000);
  nowTsValEl.textContent = currentNow;

  setInterval(() => {
    currentNow = Math.floor(Date.now() / 1000);
    nowTsValEl.textContent = currentNow;
  }, 1000);

  function formatLocal(d) {
    const base = new Intl.DateTimeFormat(undefined, {
      weekday: 'short', year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    }).format(d);
    const offsetMin = -d.getTimezoneOffset();
    const sign = offsetMin >= 0 ? '+' : '-';
    const abs = Math.abs(offsetMin);
    const hh = String(Math.floor(abs / 60)).padStart(2, '0');
    const mm = String(abs % 60).padStart(2, '0');
    return `${base} (UTC${sign}${hh}:${mm})`;
  }

  function formatUtc(d) {
    return new Intl.DateTimeFormat('en-GB', {
      year: 'numeric', month: 'short', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'UTC', hour12: false
    }).format(d) + ' UTC';
  }

  function formatRelative(seconds) {
    const diff = seconds - Math.floor(Date.now() / 1000);
    const abs = Math.abs(diff);
    const units = [['year', 31536000], ['month', 2592000], ['day', 86400], ['hour', 3600], ['minute', 60], ['second', 1]];
    for (const [unit, secs] of units) {
      if (abs >= secs || unit === 'second') {
        const val = Math.round(abs / secs);
        const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
        return rtf.format(diff < 0 ? -val : val, unit);
      }
    }
  }

  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = original; }, 1400);
    });
  }

  let lastLocalResult = '';

  function updateResult() {
    const raw = tsInput.value.trim();

    if (raw.length === 0) {
      resultCard.style.display = 'none';
      errorMsg.style.display = 'none';
      return;
    }

    if (/^-?\d+$/.test(raw)) {
      const seconds = parseInt(raw, 10);
      const d = new Date(seconds * 1000);
      if (!isNaN(d.getTime())) {
        lastLocalResult = formatLocal(d);
        localResultEl.textContent = lastLocalResult;
        utcResultEl.textContent = formatUtc(d);
        relativeResultEl.textContent = formatRelative(seconds);
        resultCard.style.display = 'flex';
        errorMsg.style.display = 'none';
        return;
      }
    }

    resultCard.style.display = 'none';
    errorMsg.style.display = 'block';
  }

  tsInput.addEventListener('input', updateResult);
  useNowBtn.addEventListener('click', () => {
    tsInput.value = String(Math.floor(Date.now() / 1000));
    updateResult();
  });
  copyNowBtn.addEventListener('click', () => copyText(String(currentNow), copyNowBtn));
  copyLocalBtn.addEventListener('click', () => copyText(lastLocalResult, copyLocalBtn));
</script>

</body>
</html>
